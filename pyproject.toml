[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-ledger"
version = "0.1.0"
description = "File-first session archiving, structured memory objects, and bright/dark ledgers for any AI agent."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Yufan Yang"}]
keywords = ["agent", "memory", "session", "archive", "ledger", "rag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
chroma = [
  "chromadb>=1.5.9,<2",
  "fastembed>=0.8,<0.9",
  "socksio>=1,<2",
]

[project.scripts]
agent-memory-ledger = "agent_memory_ledger.cli:main"
aml = "agent_memory_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

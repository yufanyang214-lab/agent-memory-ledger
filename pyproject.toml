[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-ledger"
version = "0.1.1"
description = "File-first session archiving, structured memory objects, and bright/dark ledgers for any AI agent."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Yufan Yang"}]
keywords = ["agent", "memory", "session", "archive", "ledger", "rag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Repository = "https://github.com/yufanyang214-lab/agent-memory-ledger"
Issues = "https://github.com/yufanyang214-lab/agent-memory-ledger/issues"
Changelog = "https://github.com/yufanyang214-lab/agent-memory-ledger/blob/main/CHANGELOG.md"

[project.scripts]
agent-memory-ledger = "agent_memory_ledger.cli:main"
aml = "agent_memory_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

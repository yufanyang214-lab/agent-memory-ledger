name: tests

on:
  push:
    branches-ignore:
      - 'release/**'
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests scripts integrations
      - run: python scripts/clean_room_smoke.py
      - name: Build candidate packages
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m pip install "setuptools>=61" wheel
          python scripts/build_release.py
      - uses: actions/upload-artifact@v7.0.1
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          name: agent-memory-ledger-${{ github.sha }}
          path: dist/*/*
